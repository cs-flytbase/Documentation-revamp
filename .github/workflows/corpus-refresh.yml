name: Corpus Refresh (Daily)

# Keeps the Pinecone index in step with the docs and releases repos.
# It used to crawl the websites, which answer bots with 429; from July to
# October 2026 it reported green every week while adding nothing. It now
# reads the Markdown from GitHub (src/corpus_sync.py), re-embeds only pages
# whose content changed, and alerts Slack when anything goes wrong.

on:
  schedule:
    - cron: '0 3 * * *'   # daily, 03:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: 'Which repo to sync'
        required: false
        default: 'all'
        type: choice
        options: [all, docs, releases]
      dry_run:
        description: 'Report what would change without writing to the index'
        required: false
        default: false
        type: boolean
      remove_legacy:
        description: 'One-time: after a clean sync, remove the old website crawler vectors'
        required: false
        default: false
        type: boolean

concurrency:
  group: corpus-refresh
  cancel-in-progress: false

jobs:
  refresh-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync the corpus from GitHub
        env:
          CORPUS_GITHUB_TOKEN: ${{ secrets.FLYTBASE_GITHUB_TOKEN }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERT_CHANNEL: ${{ vars.SLACK_ALERT_CHANNEL }}
          SOURCE: ${{ inputs.source || 'all' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          REMOVE_LEGACY: ${{ inputs.remove_legacy && '--remove-legacy' || '' }}
          CORPUS_REPORTED_MARKER: ${{ runner.temp }}/corpus_reported
        run: |
          python -m src.corpus_sync --source "$SOURCE" $DRY_RUN $REMOVE_LEGACY

      - name: Alert if the job crashed before it could report
        # Only a crash: when the sync reported (and alerted) itself it leaves
        # the marker, and a second alert for the same failure is noise.
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERT_CHANNEL: ${{ vars.SLACK_ALERT_CHANNEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CORPUS_REPORTED_MARKER: ${{ runner.temp }}/corpus_reported
        run: |
          if [ -f "$CORPUS_REPORTED_MARKER" ]; then
            echo "The sync reported this failure itself; no second alert."
            exit 0
          fi
          python -m src.corpus_sync --alert "Corpus refresh failed before it could report. The knowledge index may be stale. Run $RUN_URL"
