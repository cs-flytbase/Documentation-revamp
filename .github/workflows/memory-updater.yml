name: Memory Updater

on:
  # Triggered by feedback-trigger.yml in flytbase-docs and flytbase-releases
  repository_dispatch:
    types: [pr-feedback]

  # Also allows direct /feedback comments on this repo's PRs
  issue_comment:
    types: [created]

jobs:
  update-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # For issue_comment: only run on PR comments
    if: |
      github.event_name == 'repository_dispatch' ||
      github.event.issue.pull_request != null

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << ENVEOF
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME=flytbase-docs
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER=openai
          GITHUB_TOKEN=${{ secrets.FLYTBASE_GITHUB_TOKEN }}
          INPUT_BUNDLE_DIR=./input_bundles
          OUTPUT_DIR=./output
          MEMORY_DIR=./memory
          ENVEOF

      - name: Extract feedback text
        id: feedback
        env:
          DISPATCH_FEEDBACK: ${{ github.event.client_payload.feedback }}
          DISPATCH_PR: ${{ github.event.client_payload.pr_number }}
          DISPATCH_REPO: ${{ github.event.client_payload.source_repo }}
          DISPATCH_USER: ${{ github.event.client_payload.commenter }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            FEEDBACK="$DISPATCH_FEEDBACK"
            SOURCE="PR #${DISPATCH_PR} in ${DISPATCH_REPO} by ${DISPATCH_USER}"
          else
            FEEDBACK="$COMMENT_BODY"
            SOURCE="PR #${ISSUE_NUMBER} in this repo"
          fi
          echo "text=$FEEDBACK" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          echo "Feedback from $SOURCE"

      - name: Run memory updater
        env:
          FEEDBACK_TEXT: ${{ steps.feedback.outputs.text }}
        run: |
          python -m src.agents.memory_updater --feedback "$FEEDBACK_TEXT"

      - name: Commit updated memory files
        env:
          FEEDBACK_SOURCE: ${{ steps.feedback.outputs.source }}
        run: |
          git config user.name "FlytBase Doc Pipeline"
          git config user.email "docs-pipeline@flytbase.com"
          git add memory/
          git diff --staged --quiet && echo "No memory changes to commit" || \
            git commit -m "memory: update from $FEEDBACK_SOURCE"
          git push
