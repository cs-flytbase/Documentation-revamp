name: Memory Updater

on:
  issue_comment:
    types: [created]

jobs:
  update-memory:
    # Only run on PR comments starting with /feedback
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/feedback')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << ENVEOF
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME=flytbase-docs
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER=openai
          GITHUB_TOKEN=${{ secrets.FLYTBASE_GITHUB_TOKEN }}
          INPUT_BUNDLE_DIR=./input_bundles
          OUTPUT_DIR=./output
          MEMORY_DIR=./memory
          ENVEOF

      - name: Extract feedback text
        id: feedback
        run: |
          # Strip the /feedback prefix and trim whitespace
          COMMENT="${{ github.event.comment.body }}"
          FEEDBACK="${COMMENT#/feedback}"
          FEEDBACK="${FEEDBACK#"${FEEDBACK%%[![:space:]]*}"}"
          echo "text=$FEEDBACK" >> $GITHUB_OUTPUT
          echo "Feedback: $FEEDBACK"

      - name: Run memory updater
        run: |
          python -m src.agents.memory_updater --feedback "${{ steps.feedback.outputs.text }}"

      - name: Commit updated memory files
        run: |
          git config user.name "FlytBase Doc Pipeline"
          git config user.email "docs-pipeline@flytbase.com"
          git add memory/
          git diff --staged --quiet && echo "No memory changes" || \
            git commit -m "memory: update from PR #${{ github.event.issue.number }} feedback"
          git push

      - name: Reply to comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Feedback received and saved to memory. The pipeline will apply this correction on the next run.'
            })
