name: Memory Updater

on:
  # Triggered by feedback-trigger.yml in flytbase-docs and flytbase-releases
  repository_dispatch:
    types: [pr-feedback]

  # Also allows direct /feedback comments on this repo's PRs
  issue_comment:
    types: [created]

jobs:
  update-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # For issue_comment: only run on PR comments
    if: |
      github.event_name == 'repository_dispatch' ||
      github.event.issue.pull_request != null

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << ENVEOF
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME=flytbase-docs
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER=openai
          GITHUB_TOKEN=${{ secrets.FLYTBASE_GITHUB_TOKEN }}
          INPUT_BUNDLE_DIR=./input_bundles
          OUTPUT_DIR=./output
          MEMORY_DIR=./memory
          ENVEOF

      - name: Extract feedback text
        id: feedback
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            FEEDBACK="${{ github.event.client_payload.feedback }}"
            SOURCE="PR #${{ github.event.client_payload.pr_number }} in ${{ github.event.client_payload.source_repo }} by ${{ github.event.client_payload.commenter }}"
          else
            COMMENT="${{ github.event.comment.body }}"
            FEEDBACK="$COMMENT"
            SOURCE="PR #${{ github.event.issue.number }} in this repo"
          fi
          echo "text=$FEEDBACK" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          echo "Feedback from $SOURCE: $FEEDBACK"

      - name: Run memory updater
        run: |
          python -m src.agents.memory_updater --feedback "${{ steps.feedback.outputs.text }}"

      - name: Commit updated memory files
        run: |
          git config user.name "FlytBase Doc Pipeline"
          git config user.email "docs-pipeline@flytbase.com"
          git add memory/
          git diff --staged --quiet && echo "No memory changes to commit" || \
            git commit -m "memory: update from ${{ steps.feedback.outputs.source }}"
          git push
