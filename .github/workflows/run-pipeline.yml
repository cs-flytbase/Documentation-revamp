name: Documentation Pipeline

on:
  push:
    paths:
      - 'input_bundles/**'
  workflow_dispatch:
    inputs:
      bundle_name:
        description: 'Input bundle folder name (e.g. site-pointers)'
        required: true
        type: string

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect changed bundle (on push)
        if: github.event_name == 'push'
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^input_bundles/' | cut -d'/' -f2 | sort -u | head -1)
          echo "bundle=$CHANGED" >> $GITHUB_OUTPUT
          echo "Detected bundle: $CHANGED"

      - name: Set bundle name
        id: bundle
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.bundle_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ steps.detect.outputs.bundle }}" >> $GITHUB_OUTPUT
          fi

      - name: Validate bundle exists
        run: |
          if [ -z "${{ steps.bundle.outputs.name }}" ]; then
            echo "No bundle detected. Exiting."
            exit 1
          fi
          if [ ! -d "input_bundles/${{ steps.bundle.outputs.name }}" ]; then
            echo "Bundle not found: input_bundles/${{ steps.bundle.outputs.name }}"
            exit 1
          fi
          echo "Running pipeline for bundle: ${{ steps.bundle.outputs.name }}"

      - name: Create .env from secrets
        run: |
          cat > .env << ENVEOF
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME=flytbase-docs
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER=openai
          GITHUB_TOKEN=${{ secrets.FLYTBASE_GITHUB_TOKEN }}
          INPUT_BUNDLE_DIR=./input_bundles
          OUTPUT_DIR=./output
          MEMORY_DIR=./memory
          ENVEOF

      - name: Run pipeline
        run: python -m src.orchestrator ./input_bundles/${{ steps.bundle.outputs.name }}

      - name: Upload pipeline output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ steps.bundle.outputs.name }}
          path: output/
          retention-days: 14
