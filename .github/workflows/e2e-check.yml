name: End-to-End Check (Weekly)

# The real pipeline, the real model, once a week, in sandbox mode: the
# committed Cockpit 3.0 material goes through every stage, is committed to
# disposable sandbox/<tag>/ branches (no PR, no label, no edit to an existing
# page), is read back and checked against the same invariants as the CI
# replay (src/invariants.py), and the branches are deleted. Slack hears about
# it only when an invariant fails; the job fails then too.

on:
  schedule:
    - cron: '0 5 * * 3'   # Wednesdays 05:00 UTC
  workflow_dispatch:
    inputs:
      keep_branches:
        description: 'Leave the sandbox branches for inspection (delete them by hand afterwards)'
        required: false
        default: false
        type: boolean

concurrency:
  group: e2e-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << ENVEOF
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME=flytbase-docs
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL=https://openrouter.ai/api/v1
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER=openai
          GITHUB_TOKEN=${{ secrets.FLYTBASE_GITHUB_TOKEN }}
          INPUT_BUNDLE_DIR=./input_bundles
          OUTPUT_DIR=./output
          MEMORY_DIR=./memory
          ENVEOF

      - name: Run the end-to-end check
        env:
          GITHUB_TOKEN: ${{ secrets.FLYTBASE_GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERT_CHANNEL: ${{ vars.SLACK_ALERT_CHANNEL }}
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          KEEP: ${{ inputs.keep_branches }}
        run: |
          if [ "$KEEP" = "true" ]; then
            python3 -m src.e2e_check --keep
          else
            python3 -m src.e2e_check
          fi
