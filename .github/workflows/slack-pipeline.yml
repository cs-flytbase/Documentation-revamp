name: Slack DocAgent Pipeline

on:
  repository_dispatch:
    types: [slack-pipeline]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << ENVEOF
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME=flytbase-docs
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER=openai
          GITHUB_TOKEN=${{ secrets.FLYTBASE_GITHUB_TOKEN }}
          INPUT_BUNDLE_DIR=./input_bundles
          OUTPUT_DIR=./output
          MEMORY_DIR=./memory
          ENVEOF

      - name: Extract payload
        id: payload
        run: |
          echo "feature_name=${{ github.event.client_payload.feature_name }}" >> $GITHUB_OUTPUT
          echo "mode=${{ github.event.client_payload.mode }}" >> $GITHUB_OUTPUT
          echo "content_key=${{ github.event.client_payload.content_key }}" >> $GITHUB_OUTPUT
          echo "worker_url=${{ github.event.client_payload.worker_url }}" >> $GITHUB_OUTPUT

      - name: Fetch content from Worker KV and run pipeline
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python3 -c "
          import json, os, sys, urllib.request
          sys.path.insert(0, '.')

          feature_name = '${{ steps.payload.outputs.feature_name }}'
          mode = '${{ steps.payload.outputs.mode }}' or 'both'
          content_key = '${{ steps.payload.outputs.content_key }}'
          worker_url = '${{ steps.payload.outputs.worker_url }}'
          slack_token = os.environ.get('SLACK_BOT_TOKEN', '')

          # Step 0: Fetch content from Worker KV
          print('=' * 60)
          print(f'[Slack Pipeline] Fetching content from KV: {content_key}')
          kv_url = f'{worker_url}/content?key={content_key}'
          req = urllib.request.Request(kv_url, headers={'User-Agent': 'FlytBase-Pipeline/1.0'})
          with urllib.request.urlopen(req) as resp:
              kv_data = json.loads(resp.read().decode())

          # Build content from KV data (new format: text_files + links + content)
          raw_content = kv_data.get('content', '')
          text_files = kv_data.get('text_files', [])
          links = kv_data.get('links', [])
          image_urls = kv_data.get('image_urls', [])

          # Combine all content sources into one string for the Source Agent
          content_parts = []
          # Add any links (Source Agent will scrape them)
          for link in links:
              content_parts.append(link)
          # Add text file contents
          for tf in text_files:
              content_parts.append(tf.get('content', ''))
          # Add raw user text
          if raw_content:
              content_parts.append(raw_content)
          content = '\n\n'.join(content_parts)

          # Extract reference link (first link that looks like releases.flytbase.com)
          reference_link = ''
          comments = raw_content[:500] if raw_content else ''
          for link in links:
              if 'releases.flytbase.com' in link:
                  reference_link = link
                  break

          print(f'[Slack Pipeline] Content: {len(content)} chars, Files: {len(text_files)}, Links: {len(links)}, Images: {len(image_urls)}')

          # Step 0.5: Download images from Slack
          from pathlib import Path
          bundle_dir = f'input_bundles/{feature_name}'
          Path(bundle_dir).mkdir(parents=True, exist_ok=True)

          for i, url in enumerate(image_urls or []):
              if not url: continue
              ext = url.split('.')[-1].split('?')[0]
              if ext not in ('png','jpg','jpeg','gif','webp'): ext = 'png'
              filename = f'image-{i+1}.{ext}'
              filepath = os.path.join(bundle_dir, filename)
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {slack_token}'})
              try:
                  with urllib.request.urlopen(req) as resp:
                      with open(filepath, 'wb') as f:
                          f.write(resp.read())
                  print(f'Downloaded: {filename}')
              except Exception as e:
                  print(f'Failed to download {url}: {e}')

          # Step 1: Source Agent — build pm_doc from content
          from src.agents.source import SourceAgent
          from src.orchestrator import run_pipeline

          print('[Slack Pipeline] Running Source Agent...')
          source_agent = SourceAgent()
          source_result = source_agent.build_pm_doc(
              content=content,
              comments=comments,
              reference_link=reference_link,
          )

          if source_result.get('error'):
              print(f'Source Agent failed: {source_result[\"error\"]}')
              sys.exit(1)

          pm_doc = source_result['pm_doc']
          print(f'[Slack Pipeline] PM doc generated ({len(pm_doc)} chars)')

          # Write pm_doc to bundle directory
          pm_doc_path = Path(bundle_dir) / 'pm_doc.md'
          pm_doc_path.write_text(pm_doc)

          # Step 2: Run the existing pipeline
          print('[Slack Pipeline] Running pipeline...')
          result = run_pipeline(bundle_dir, mode=mode)
          print(f'[Slack Pipeline] Pipeline result: {result.get(\"status\", \"unknown\")}')

          # Save PR URLs and file paths for the notification step
          from datetime import datetime
          release_month = datetime.now().strftime('%B-%Y').lower()
          pr_results = result.get('pr_results', {})
          draft = result.get('draft', {}) if 'draft' in result else {}
          rn = draft.get('release_note', {}) if draft else {}
          dp = draft.get('doc_page', {}) if draft else {}
          pr_results['release_note_file'] = f'{release_month}/{rn.get(\"filename\", \"\")}' if rn.get('filename') else ''
          pr_results['doc_page_file'] = dp.get('filename', '')
          with open('pr_results.json', 'w') as f:
              json.dump(pr_results, f)
          "

      - name: Notify Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python3 -c "
          import json, os, urllib.request

          token = os.environ['SLACK_BOT_TOKEN']

          # Fetch Slack channel/thread info from KV
          content_key = '${{ steps.payload.outputs.content_key }}'
          worker_url = '${{ steps.payload.outputs.worker_url }}'
          channel = ''
          thread_ts = ''
          try:
              kv_url = f'{worker_url}/content?key={content_key}'
              req = urllib.request.Request(kv_url, headers={'User-Agent': 'FlytBase-Pipeline/1.0'})
              with urllib.request.urlopen(req) as resp:
                  kv_data = json.loads(resp.read().decode())
              channel = kv_data.get('slack_channel', '')
              thread_ts = kv_data.get('slack_thread_ts', '')
          except Exception as e:
              print(f'Could not fetch Slack info from KV: {e}')

          # Read PR results
          pr_results = {}
          try:
              with open('pr_results.json') as f:
                  pr_results = json.load(f)
          except: pass

          releases_pr = pr_results.get('releases_pr', '')
          docs_pr = pr_results.get('docs_pr', '')
          errors = pr_results.get('errors', [])

          # Build message
          rn_file = pr_results.get('release_note_file', '')
          dp_file = pr_results.get('doc_page_file', '')

          lines = []
          if releases_pr:
              lines.append(f':white_check_mark: *Release Note PR:* {releases_pr}')
              if rn_file:
                  lines.append(f'  File: `{rn_file}` in FlytBaseAILabs/flytbase-releases')
          if docs_pr:
              lines.append(f':white_check_mark: *Doc Page PR:* {docs_pr}')
              if dp_file:
                  lines.append(f'  File: `{dp_file}` in FlytBaseAILabs/flytbase-docs')
          if errors:
              lines.append(':warning: *Errors:*')
              for e in errors:
                  lines.append(f'  • {e}')
          if not lines:
              lines.append(':x: Pipeline completed but no PRs were created. Check the Actions log.')

          lines.append('')
          lines.append('Want me to change anything?')

          message = '\n'.join(lines)

          # Post to Slack
          if channel and thread_ts:
              payload = json.dumps({
                  'channel': channel,
                  'thread_ts': thread_ts,
                  'text': message,
              }).encode()
              req = urllib.request.Request(
                  'https://slack.com/api/chat.postMessage',
                  data=payload,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                  },
              )
              urllib.request.urlopen(req)
              print(f'Posted to Slack: {channel}/{thread_ts}')
          else:
              print(f'No Slack channel/thread info. PR results: {message}')
          "

      - name: Upload pipeline output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slack-pipeline-output-${{ github.event.client_payload.feature_name }}
          path: output/
          retention-days: 14
