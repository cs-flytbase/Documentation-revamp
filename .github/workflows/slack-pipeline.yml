name: Slack DocAgent Pipeline
# The thread id in the run title is how Son of Anton's diagnose_failure finds
# the runs that belong to a Slack thread.
run-name: "slack-pipeline: ${{ github.event.client_payload.feature_name }} [thread ${{ github.event.client_payload.slack_thread_ts }}]"

on:
  repository_dispatch:
    types: [slack-pipeline]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << ENVEOF
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME=flytbase-docs
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL=https://openrouter.ai/api/v1
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER=openai
          GITHUB_TOKEN=${{ secrets.FLYTBASE_GITHUB_TOKEN }}
          INPUT_BUNDLE_DIR=./input_bundles
          OUTPUT_DIR=./output
          MEMORY_DIR=./memory
          ENVEOF

      - name: Extract payload
        id: payload
        # Payload values are user- and model-supplied (a requested section name,
        # a feature name). They reach the shell only through env, never as
        # ${{ }} text inside the script, so quotes, $(...) or backticks in them
        # are data, not code. The delimiter form keeps multi-line values intact.
        env:
          P_FEATURE_NAME: ${{ github.event.client_payload.feature_name }}
          P_MODE: ${{ github.event.client_payload.mode }}
          P_CONTENT_KEY: ${{ github.event.client_payload.content_key }}
          P_WORKER_URL: ${{ github.event.client_payload.worker_url }}
          P_REQUESTER_NAME: ${{ github.event.client_payload.requester_name }}
          P_REQUESTER_USERNAME: ${{ github.event.client_payload.requester_username }}
          P_SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}
          P_SLACK_THREAD_TS: ${{ github.event.client_payload.slack_thread_ts }}
          P_TARGET_SECTION: ${{ github.event.client_payload.target_section }}
          P_ALLOW_NEW_SECTION: ${{ github.event.client_payload.allow_new_section }}
          P_DOC_SCOPE: ${{ github.event.client_payload.doc_scope }}
        run: |
          put() {
            d="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$1" "$d" "$2" "$d" >> "$GITHUB_OUTPUT"
          }
          put feature_name "$P_FEATURE_NAME"
          put mode "$P_MODE"
          put content_key "$P_CONTENT_KEY"
          put worker_url "$P_WORKER_URL"
          put requester_name "$P_REQUESTER_NAME"
          put requester_username "$P_REQUESTER_USERNAME"
          put slack_channel "$P_SLACK_CHANNEL"
          put slack_thread_ts "$P_SLACK_THREAD_TS"
          put target_section "$P_TARGET_SECTION"
          put allow_new_section "$P_ALLOW_NEW_SECTION"
          put doc_scope "$P_DOC_SCOPE"

      - name: Extract subsections
        id: subsections
        env:
          P_SUBSECTIONS: ${{ github.event.client_payload.subsections }}
        run: |
          # Subsections is passed as a JSON string; written to a file for Python.
          if [ -n "$P_SUBSECTIONS" ] && [ "$P_SUBSECTIONS" != "null" ]; then
            printf '%s' "$P_SUBSECTIONS" > /tmp/subsections.json
            echo "has_subsections=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_subsections=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch content from Worker KV and run pipeline
        id: run
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PL_FEATURE_NAME: ${{ steps.payload.outputs.feature_name }}
          PL_MODE: ${{ steps.payload.outputs.mode }}
          PL_CONTENT_KEY: ${{ steps.payload.outputs.content_key }}
          PL_WORKER_URL: ${{ steps.payload.outputs.worker_url }}
          PL_CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
          PL_REQUESTER_NAME: ${{ steps.payload.outputs.requester_name }}
          PL_REQUESTER_USERNAME: ${{ steps.payload.outputs.requester_username }}
          PL_SLACK_CHANNEL: ${{ steps.payload.outputs.slack_channel }}
          PL_SLACK_THREAD_TS: ${{ steps.payload.outputs.slack_thread_ts }}
          PL_TARGET_SECTION: ${{ steps.payload.outputs.target_section }}
          PL_ALLOW_NEW_SECTION: ${{ steps.payload.outputs.allow_new_section }}
          PL_DOC_SCOPE: ${{ steps.payload.outputs.doc_scope }}
          PL_HAS_SUBSECTIONS: ${{ steps.subsections.outputs.has_subsections }}
        # The run lives in src/slack_run.py (tested), not in an inline script.
        # It reports each stage live in Slack and writes pipeline_status.json.
        # continue-on-error lets the notify step run; the last step fails the
        # job if the run failed, so a green run in Actions means it worked.
        continue-on-error: true
        run: python3 -m src.slack_run

      - name: Notify Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PL_SLACK_CHANNEL: ${{ steps.payload.outputs.slack_channel }}
          PL_SLACK_THREAD_TS: ${{ steps.payload.outputs.slack_thread_ts }}
          PL_WORKER_URL: ${{ steps.payload.outputs.worker_url }}
          PL_CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
        run: python3 -m src.slack_notify

      - name: Upload pipeline output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slack-pipeline-output-${{ github.event.client_payload.feature_name }}
          path: output/
          retention-days: 14

      - name: Fail the job if the run failed
        if: always()
        run: python3 -m src.slack_run --check-status
