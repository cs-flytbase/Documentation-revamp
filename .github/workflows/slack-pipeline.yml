name: Slack DocAgent Pipeline
# The thread id in the run title is how Son of Anton's diagnose_failure finds
# the runs that belong to a Slack thread.
run-name: "slack-pipeline: ${{ github.event.client_payload.feature_name }} [thread ${{ github.event.client_payload.slack_thread_ts }}]"

on:
  repository_dispatch:
    types: [slack-pipeline]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << ENVEOF
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME=flytbase-docs
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL=https://openrouter.ai/api/v1
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER=openai
          GITHUB_TOKEN=${{ secrets.FLYTBASE_GITHUB_TOKEN }}
          INPUT_BUNDLE_DIR=./input_bundles
          OUTPUT_DIR=./output
          MEMORY_DIR=./memory
          ENVEOF

      - name: Extract payload
        id: payload
        run: |
          echo "feature_name=${{ github.event.client_payload.feature_name }}" >> $GITHUB_OUTPUT
          echo "mode=${{ github.event.client_payload.mode }}" >> $GITHUB_OUTPUT
          echo "content_key=${{ github.event.client_payload.content_key }}" >> $GITHUB_OUTPUT
          echo "worker_url=${{ github.event.client_payload.worker_url }}" >> $GITHUB_OUTPUT
          echo "requester_name=${{ github.event.client_payload.requester_name }}" >> $GITHUB_OUTPUT
          echo "requester_username=${{ github.event.client_payload.requester_username }}" >> $GITHUB_OUTPUT
          echo "slack_channel=${{ github.event.client_payload.slack_channel }}" >> $GITHUB_OUTPUT
          echo "slack_thread_ts=${{ github.event.client_payload.slack_thread_ts }}" >> $GITHUB_OUTPUT
          echo "target_section=${{ github.event.client_payload.target_section }}" >> $GITHUB_OUTPUT
          echo "allow_new_section=${{ github.event.client_payload.allow_new_section }}" >> $GITHUB_OUTPUT
          echo "doc_scope=${{ github.event.client_payload.doc_scope }}" >> $GITHUB_OUTPUT

      - name: Extract subsections
        id: subsections
        run: |
          # Subsections is passed as a JSON string — write to file for Python to read
          SUBSECTIONS_JSON='${{ github.event.client_payload.subsections }}'
          if [ -n "$SUBSECTIONS_JSON" ] && [ "$SUBSECTIONS_JSON" != "null" ]; then
            echo "$SUBSECTIONS_JSON" > /tmp/subsections.json
            echo "has_subsections=true" >> $GITHUB_OUTPUT
          else
            echo "has_subsections=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch content from Worker KV and run pipeline
        id: run
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PL_FEATURE_NAME: ${{ steps.payload.outputs.feature_name }}
          PL_MODE: ${{ steps.payload.outputs.mode }}
          PL_CONTENT_KEY: ${{ steps.payload.outputs.content_key }}
          PL_WORKER_URL: ${{ steps.payload.outputs.worker_url }}
          PL_CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
          PL_REQUESTER_NAME: ${{ steps.payload.outputs.requester_name }}
          PL_REQUESTER_USERNAME: ${{ steps.payload.outputs.requester_username }}
          PL_SLACK_CHANNEL: ${{ steps.payload.outputs.slack_channel }}
          PL_SLACK_THREAD_TS: ${{ steps.payload.outputs.slack_thread_ts }}
          PL_TARGET_SECTION: ${{ steps.payload.outputs.target_section }}
          PL_ALLOW_NEW_SECTION: ${{ steps.payload.outputs.allow_new_section }}
          PL_DOC_SCOPE: ${{ steps.payload.outputs.doc_scope }}
          PL_HAS_SUBSECTIONS: ${{ steps.subsections.outputs.has_subsections }}
        # The run lives in src/slack_run.py (tested), not in an inline script.
        # It reports each stage live in Slack and writes pipeline_status.json.
        # continue-on-error lets the notify step run; the last step fails the
        # job if the run failed, so a green run in Actions means it worked.
        continue-on-error: true
        run: python3 -m src.slack_run

      - name: Notify Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PL_SLACK_CHANNEL: ${{ steps.payload.outputs.slack_channel }}
          PL_SLACK_THREAD_TS: ${{ steps.payload.outputs.slack_thread_ts }}
        run: python3 -m src.slack_notify

      - name: Upload pipeline output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slack-pipeline-output-${{ github.event.client_payload.feature_name }}
          path: output/
          retention-days: 14

      - name: Fail the job if the run failed
        if: always()
        run: python3 -m src.slack_run --check-status
